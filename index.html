<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FreelanceBoost - Tech Guest Post Writing Helper & Proposal Writer</title>
    <meta name="description" content="AI writing assistant and proposal creator for tech blog guest authors and freelancers. Create compelling outlines, human-toned drafts, and winning Upwork proposals." />
    <meta property="og:title" content="FreelanceBoost - Tech Guest Post Writing Helper & Proposal Writer" />
    <meta property="og:description" content="AI writing assistant and proposal creator for tech blog guest authors and freelancers. Create compelling outlines, human-toned drafts, and winning Upwork proposals." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />

    <!-- PWA Web App Manifest & Browser Capabilities -->
    <link rel="manifest" href="./manifest.webmanifest" />
    <meta name="theme-color" content="#4f46e5" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="FreelanceBoost" />

    <!-- PWA Icons -->
    <link rel="icon" type="image/svg+xml" href="./icon.svg" />
    <link rel="icon" type="image/png" sizes="192x192" href="./pwa-192x192.png" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />

    <!-- Typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  </head>
  <body class="bg-slate-50 text-slate-900 dark:bg-slate-950 dark:text-slate-100 antialiased min-h-screen selection:bg-indigo-500 selection:text-white transition-colors duration-200">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // Register Service Worker with relative scope for GitHub Pages compatibility
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('./sw.js', { scope: './' })
            .then((registration) => {
              console.log('FreelanceBoost Service Worker registered with scope:', registration.scope);
            })
            .catch((error) => {
              console.warn('FreelanceBoost Service Worker registration skipped or failed:', error);
            });
        });
      }
    </script>
  </body>
</html>
