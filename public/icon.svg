<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#4f46e5" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
    <linearGradient id="accent-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#c7d2fe" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded rectangle -->
  <rect width="512" height="512" rx="112" fill="url(#bg-grad)" />

  <!-- Subtle inner border -->
  <rect x="8" y="8" width="496" height="496" rx="104" fill="none" stroke="#818cf8" stroke-opacity="0.3" stroke-width="4" />

  <!-- Pen & Sparkle Glyph -->
  <g filter="url(#glow)">
    <!-- Main Sparkle star -->
    <path d="M256 96 C256 180 180 256 96 256 C180 256 256 332 256 416 C256 332 332 256 416 256 C332 256 256 180 256 96 Z" fill="url(#accent-grad)" />
    <!-- Secondary small sparkle -->
    <path d="M370 120 C370 145 345 170 320 170 C345 170 370 195 370 220 C370 195 395 170 420 170 C395 170 370 145 370 120 Z" fill="#38bdf8" />
    <!-- Center core pen nib / accent dot -->
    <circle cx="256" cy="256" r="24" fill="#4338ca" />
  </g>
</svg>
